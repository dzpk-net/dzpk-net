name: profile

# 每周一 09:30(北京)把本周精选写进主页。
#
# 比 dzpk-net/weekly 的定时晚半小时,好让那边先把这一期提交上去——主页里「完整周报」
# 指向的是那个仓库。不过两者并不真的互相依赖:主页取的是 dzpk.net 的公开端点,链接也
# 只指到仓库首页,那边就算跳过了这一期,主页这边照样成立。
on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # action 锁到 commit SHA:版本标签可以被上游改指到别处,而这个 job 有 contents: write。
      # 升级交给 dependabot 提 PR。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - run: node scripts/build-profile.mjs

      # 上游数据异常时脚本会直接跳过、什么都不写,所以先看有没有改动,否则每周推一个空提交。
      # 身份用 noreply 地址:账号开了邮箱隐藏,提交元数据里不该出现真实邮箱。
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "本周精选没有变化,跳过提交"
            exit 0
          fi
          git config user.name 'dzpk-net'
          git config user.email '312671510+dzpk-net@users.noreply.github.com'
          git add -A
          git commit -m 'docs: 更新本周精选'
          git push
